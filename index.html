        body { background-color: #020617; color: #f8fafc; overflow: hidden; height: 100vh; display: flex; }
        
        /* Subtle Corporate Background Glow */
        body::before { content: ''; position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(139,92,246,0.08) 0%, transparent 60%); z-index: -1; pointer-events: none; }
        body::after { content: ''; position: fixed; bottom: -10%; right: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(245,158,11,0.05) 0%, transparent 60%); z-index: -1; pointer-events: none; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--tw-shadow-glass);
        }
        /* =========================================================
           ULTRA PREMIUM SIDEBAR (AURORA GLASSMORPHISM)
           ========================================================= */
        .sidebar {
            background: linear-gradient(180deg, rgba(2, 6, 23, 0.85) 0%, rgba(15, 23, 42, 0.95) 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 15px 0 40px -10px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            position: relative;
            z-index: 50;
        }
        
        /* Garis Cahaya Gradasi Halus di Tepi Kanan Sidebar */
        .sidebar::after {
            content: ''; position: absolute; top: 0; right: 0; width: 1px; height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(139, 92, 246, 0.4), rgba(6, 182, 212, 0.4), transparent);
            opacity: 0.6; pointer-events: none;
        }

        /* Base Navigation Button */
        .sidebar-nav-btn {
            width: 100%; display: flex; align-items: center; gap: 0.85rem;
            padding: 0.85rem 1.25rem; border-radius: 1rem;
            font-size: 0.85rem; font-weight: 600; color: #94a3b8;
            background: transparent; border: 1px solid transparent;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden; cursor: pointer;
        }

        /* Hover Effect saat Inaktif */
        .sidebar-nav-btn:hover:not(.active) {
            color: #f8fafc; background: rgba(255, 255, 255, 0.03);
            transform: translateX(5px); border-color: rgba(255, 255, 255, 0.05);
        }

        /* Active Menu State (Premium Gradient Glow) */
        .sidebar-nav-btn.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.1));
            color: #ffffff; font-weight: 800;
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px -5px rgba(139, 92, 246, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        /* Garis Indikator Neon di Kiri Menu Aktif */
        .sidebar-nav-btn.active::before {
            content: ''; position: absolute; left: 0; top: 15%; height: 70%; width: 4px;
            background: linear-gradient(to bottom, #8b5cf6, #06b6d4);
            border-radius: 0 4px 4px 0; box-shadow: 0 0 12px #8b5cf6;
        }

        /* Ikon Menu Aktif Menyala */
        .sidebar-nav-btn.active i {
            color: #c084fc !important; /* Terang menyala */
            filter: drop-shadow(0 0 6px rgba(192, 132, 252, 0.8));
            transform: scale(1.1);
        }

        .glass-input {
            background: rgba(2, 6, 23, 0.5); border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; transition: all 0.3s ease; border-radius: 0.75rem;
        }
        .glass-input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 2px rgba(139,92,246,0.2); outline: none; }

        .btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); color: #020617; box-shadow: 0 4px 15px rgba(245,158,11,0.3); }
        .btn-gold:hover { box-shadow: 0 6px 20px rgba(245,158,11,0.5); transform: translateY(-1px); }
        
        .btn-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #ffffff; box-shadow: 0 4px 15px rgba(139,92,246,0.3); }
        .btn-purple:hover { box-shadow: 0 6px 20px rgba(139,92,246,0.5); transform: translateY(-1px); }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Custom Range Slider */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #f59e0b; cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px rgba(245,158,11,0.5); }

        async function fetchAPI(action, dataObj = null) {
            if (!API_URL || API_URL === 'PASTE_URL_WEB_APP_ANDA_DISINI') {
                ui.error("API URL Google Script belum disetting di HTML!");
                return { success: false };
            }

            // Susun payload persis seperti yang diminta oleh Backend GAS
            const payload = {
                action: action,
                userId: appState.userId,
                token: appState.token,
                moduleKey: appState.activeModule, // Penting agar Backend tahu sheet mana yang dituju
                data: dataObj
            };

            try {
                const config = {
                    method: 'POST',
                    // Gunakan text/plain agar tidak diblokir oleh CORS Browser
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                };

                const res = await fetch(API_URL, config);
                const responseText = await res.text();
                
                try {
                    return JSON.parse(responseText);
                } catch (parseError) {
                    console.error("Respon Server Bukan JSON:", responseText);
                    throw new Error("Server mengembalikan error HTML. Pastikan deployment GAS di-set 'Anyone'.");
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                ui.error(error.message || "Gagal terhubung ke Database Google Sheets.");
                return { success: false };
            }
        }

        function toggleAuthView(view) {
            const loginBox = document.getElementById('loginContainer');
            const regBox = document.getElementById('registerContainer');
            const subtitle = document.getElementById('authSubtitle');

            if (view === 'register') {
                loginBox.classList.add('hidden');

        // Eksekusi Pendaftaran Akun
        async function handleRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('regName').value.trim();
            const role = document.getElementById('regRole').value;
            const username = document.getElementById('regUser').value.trim();
            const password = document.getElementById('regPass').value;

            if (!username || !password || !fullName) {
                ui.error("Semua kolom wajib diisi.");
                return;
            }

            ui.loader(true, "Mendaftarkan Akun ke Database...");
            const res = await fetchAPI('REGISTER', { fullName, role, username, password });
            ui.loader(false);

            if (res.success) {
                // Tampilkan sukses
                Swal.fire({
                    icon: 'success', title: 'Akun Berhasil Dibuat!', text: 'Silakan Login dengan username baru Anda.',
                    background: '#0f172a', color: '#fff', confirmButtonColor: '#f59e0b'
                });
                
                // Pindah ke halaman login dan isikan otomatis username-nya
                toggleAuthView('login');
                document.getElementById('inUser').value = username;
                document.getElementById('inPass').value = ''; // Kosongkan pass agar diketik ulang
            } else {
                ui.error(res.message);
            }
        }
        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('inUser').value;
            const p = document.getElementById('inPass').value;
            
            ui.loader(true, "Authenticating...");
            const res = await fetchAPI('LOGIN', { username: u, password: p });

                appState = res.userData;
                localStorage.setItem('apexbiz_auth', JSON.stringify(appState));
                checkAuth();
            } else {
                ui.error(res.message);
            }
        }

// Helper untuk Auto-fill Form Add Modal
window.autoFillKAMFromSource = function(val) {
    if(!val) return;
    const parts = val.split('|'); // ModuleKey | ID | Subject | Value
    document.getElementById('kamSubj').value = parts[2];
    document.getElementById('kamVal').value = Number(parts[3]).toLocaleString('id-ID');
    document.getElementById('kamPotVal').value = (Number(parts[3]) * 1.5).toLocaleString('id-ID'); // Suggest 1.5x potential
};

async function saveKAMRecord() {
    const id = document.getElementById('kamId').value;
    const isEdit = !!id;
    const subject = document.getElementById('kamSubj').value.trim();
    if (!subject) { ui.error('Nama account wajib diisi!'); return; }

    const valStr = document.getElementById('kamVal').value;
    const value = Number(valStr.replace(/\D/g, '')) || 0;
    
    let existingPd = {};
    if (isEdit) {
        const d = appCache['Mod_KAM'].find(x => x.id === id);
        if(d) existingPd = JSON.parse(d.pd || '{}');
    } else {
        const linkSource = document.getElementById('kamLinkSource').value;
        if(linkSource) {
            const parts = linkSource.split('|');
            existingPd.originModule = parts[0];
            existingPd.refId = parts[1];
        } else {
            existingPd.originModule = 'Manual';
            existingPd.refId = '-';
        }
        existingPd.stakeholders = [];
        existingPd.opportunities = [];
        existingPd.timeline = [{date: new Date().toISOString().split('T')[0], note:'Account onboarded to KAM', type:'System'}];
    }

    const potStr = document.getElementById('kamPotVal').value;
    existingPd.potentialSpend = Number(potStr.replace(/\D/g, '')) || value;
    existingPd.tier = document.getElementById('kamTier').value;
    existingPd.healthScore = Number(document.getElementById('kamHealth').value) || 0;
    existingPd.strategy = existingPd.strategy || '';

    const payloadData = {
        id: isEdit ? id : 'KAM-' + Math.floor(Math.random() * 1000000),
        moduleKey: 'Mod_KAM',
        subject: subject,
        stage: 'Active',
        value: value,
        payload: JSON.stringify(existingPd),
        pd: JSON.stringify(existingPd)
    };

    ui.loader(true, "Updating Key Account...");
    const actionAPI = isEdit ? 'EDIT_RECORD' : 'ADD_RECORD';
    const res = await fetchAPI(actionAPI, payloadData);
    ui.loader(false);

    if (res.success) {
        if (!appCache['Mod_KAM']) appCache['Mod_KAM'] = [];
        if (isEdit) {
            const idx = appCache['Mod_KAM'].findIndex(x => x.id === id);
            if (idx > -1) appCache['Mod_KAM'][idx] = payloadData;
        } else {
            appCache['Mod_KAM'].unshift(payloadData);
        }
        renderKAM(document.getElementById('dynamicContentArea'), appCache['Mod_KAM']);
        Swal.close();
        ui.notify("Key Account Disimpan!");
    } else { ui.error(res.message); }
}

// 1. Fungsi Save dari Modal Add/Edit Key Account
window.saveKAMRecord = async function() {
    const id = document.getElementById('kamId').value;
    const isEdit = !!id;
    const subject = document.getElementById('kamSubj').value.trim();
    if (!subject) { ui.error('Nama account wajib diisi!'); return; }

    const valStr = document.getElementById('kamVal').value;
    const value = Number(valStr.replace(/\D/g, '')) || 0;
    
    let existingPd = {};
    if (isEdit) {
        const d = appCache['Mod_KAM'].find(x => x.id === id);
        if(d) existingPd = JSON.parse(d.pd || '{}');
    } else {
        const linkSource = document.getElementById('kamLinkSource') ? document.getElementById('kamLinkSource').value : '';
        if(linkSource) {
            const parts = linkSource.split('|');
            existingPd.originModule = parts[0];
            existingPd.refId = parts[1];
        } else {
            existingPd.originModule = 'Manual';
            existingPd.refId = '-';
        }
        existingPd.stakeholders = [];
        existingPd.opportunities = [];
        existingPd.timeline = [{date: new Date().toISOString().split('T')[0], note:'Account onboarded to KAM', type:'System'}];
    }

    const potStr = document.getElementById('kamPotVal').value;
    existingPd.potentialSpend = Number(potStr.replace(/\D/g, '')) || value;
    existingPd.tier = document.getElementById('kamTier').value;
    existingPd.healthScore = Number(document.getElementById('kamHealth').value) || 0;
    existingPd.strategy = existingPd.strategy || '';

    const payloadData = {
        id: isEdit ? id : 'KAM-' + Math.floor(Math.random() * 1000000),
        moduleKey: 'Mod_KAM',
        subject: subject,
        stage: 'Active',
        value: value,
        payload: JSON.stringify(existingPd),
        pd: JSON.stringify(existingPd)
    };

    ui.loader(true, "Updating Key Account...");
    const actionAPI = isEdit ? 'EDIT_RECORD' : 'ADD_RECORD';
    const res = await fetchAPI(actionAPI, payloadData);
    ui.loader(false);

    if (res.success) {
        if (!appCache['Mod_KAM']) appCache['Mod_KAM'] = [];
        if (isEdit) {
            const idx = appCache['Mod_KAM'].findIndex(x => x.id === id);
            if (idx > -1) appCache['Mod_KAM'][idx] = payloadData;
        } else {
            appCache['Mod_KAM'].unshift(payloadData);
        }
        
        Swal.close();
        ui.notify("Key Account Disimpan!");
        
        // MENGGUNAKAN SWITCH MODULE AGAR 100% AMAN KEMBALI KE HALAMAN KAM
        switchModule('Mod_KAM');
    } else { 
        ui.error(res.message); 
    }
};

// 2. Helper Eksekutor Universal khusus KAM
window.executeKAMSave = async function(id, acc, pdObj, successMsg) {
    const payloadData = { 
        id: id, 
        moduleKey: 'Mod_KAM', 
        subject: acc.subject || acc.sb, 
        stage: acc.stage || acc.st, 
        value: acc.value || acc.vl, 
        payload: JSON.stringify(pdObj), 
        pd: JSON.stringify(pdObj) 
    };
    
    ui.loader(true, "Updating Data...");
    const res = await fetchAPI('EDIT_RECORD', payloadData);
    ui.loader(false);
    
    if (res.success) {
        if (!appCache['Mod_KAM']) appCache['Mod_KAM'] = [];
        const idx = appCache['Mod_KAM'].findIndex(x => x.id === id);
        if (idx > -1) appCache['Mod_KAM'][idx] = payloadData;
        
        ui.notify(successMsg);
        
        // MENGGUNAKAN SWITCH MODULE AGAR 100% AMAN KEMBALI KE HALAMAN KAM
        switchModule('Mod_KAM');
        
        // Buka kembali drawer secara otomatis setelah halaman di-refresh
        setTimeout(() => {
            if (typeof window.openKAM360 === 'function') window.openKAM360(id);
        }, 300);
    } else { 
        ui.error(res.message); 
    }
};

// 3. Fungsi Save dari Drawer 360 KAM
window.saveKAMDrawerState = function() {
    const id = document.getElementById('kamDrawerId').value;
    const acc = appCache['Mod_KAM'].find(x => x.id === id);
    if(!acc) return;
    let pd = JSON.parse(acc.pd || '{}');
    pd.healthScore = Number(document.getElementById('kamDrawHealth').value) || 0;
    pd.strategy = document.getElementById('kamDrawStrategy').value.trim();
    if(!pd.timeline) pd.timeline = [];
    pd.timeline.push({date: new Date().toISOString().split('T')[0], note: 'Health/Strategy Updated', type: 'Manual'});
    
    window.executeKAMSave(id, acc, pd, "Health & Strategy Updated!");
};

window.addKAMStakeholder = function() {
    const id = document.getElementById('kamDrawerId').value;
    const name = document.getElementById('shName').value.trim();
    if(!name) return;
    const acc = appCache['Mod_KAM'].find(x => x.id === id);
    let pd = JSON.parse(acc.pd || '{}');
    if(!pd.stakeholders) pd.stakeholders = [];
    pd.stakeholders.push({ name: name, role: document.getElementById('shRole').value.trim(), engagement: document.getElementById('shEng').value });
    
    window.executeKAMSave(id, acc, pd, "Stakeholder Added!");
};

window.addKAMOpportunity = function() {
    const id = document.getElementById('kamDrawerId').value;
    const name = document.getElementById('opName').value.trim();
    const val = Number(document.getElementById('opVal').value.replace(/\D/g, '')) || 0;
    if(!name || val <= 0) return;
    const acc = appCache['Mod_KAM'].find(x => x.id === id);
    let pd = JSON.parse(acc.pd || '{}');
    if(!pd.opportunities) pd.opportunities = [];
    pd.opportunities.push({ name: name, type: document.getElementById('opType').value, value: val, stage: 'Discovery' });
    
    window.executeKAMSave(id, acc, pd, "Opportunity Added!");
};

// =================================================================
// INITIALIZE FINANCE CHARTS (MEMPERBAIKI ERROR CANVAS COLLAPSE)
// =================================================================
function initFinanceCharts(trendData, expByCat, revByCat, tRev, tExp, nProf) {
    if (typeof Chart === 'undefined') return;
    Chart.defaults.color = '#94a3b8';

    Object.keys(financeCharts).forEach(k => { if(financeCharts[k]) financeCharts[k].destroy(); });

    // 1. Trend Area Chart (Fix: Tambahkan dummy label jika kosong agar chart dirender)
    // 1. Trend Area Chart (REVISI: Menambahkan Point Radius & Tooltip Interaction)
    const ctxTrend = document.getElementById('finTrendChart');
    if (ctxTrend) {
        let labels = Object.keys(trendData).sort();
        let incData = labels.map(k => trendData[k].inc);
        let expData = labels.map(k => trendData[k].exp);

        if (labels.length === 0) {
            labels = [new Date().toISOString().split('T')[0]];
            incData = [0]; expData = [0];
        }

        financeCharts.trend = new Chart(ctxTrend.getContext('2d'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { 
                        label: 'Income', 
                        data: incData, 
                        borderColor: '#34d399', 
                        backgroundColor: 'rgba(52, 211, 153, 0.15)', 
                        fill: true, 
                        tension: 0.4,
                        pointRadius: 4, // Memastikan titik tetap terlihat walau data cuma 1 hari
                        pointHoverRadius: 6,
                        pointBackgroundColor: '#070d19',
                        pointBorderColor: '#34d399',
                        pointBorderWidth: 2
                    },
                    { 
                        label: 'Expense', 
                        data: expData, 
                        borderColor: '#fb7185', 
                        backgroundColor: 'rgba(251, 113, 133, 0.15)', 
                        fill: true, 
                        tension: 0.4,
                        pointRadius: 4, // Memastikan titik tetap terlihat
                        pointHoverRadius: 6,
                        pointBackgroundColor: '#070d19',
                        pointBorderColor: '#fb7185',
                        pointBorderWidth: 2
                    }
                ]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: { 
                    legend: { position: 'top', labels: {color:'#94a3b8'} },
                    tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', titleColor: '#fff', bodyColor: '#fff', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1 }
                }, 
                scales: { 
                    x:{ grid:{display:false}, ticks: {color: '#94a3b8'} }, 
                    y:{ grid:{color:'rgba(255,255,255,0.05)'}, ticks: {color: '#94a3b8'} } 
                } 
            }
        });
    }
    // 2. Expense Doughnut
    const ctxExp = document.getElementById('finExpChart');
    if (ctxExp) {
        financeCharts.exp = new Chart(ctxExp.getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(expByCat).length ? Object.keys(expByCat) : ['No Data'],
                datasets: [{ data: Object.values(expByCat).length ? Object.values(expByCat) : [1], backgroundColor: ['#fb7185', '#f43f5e', '#e11d48', '#be123c', '#881337'], borderColor: '#0a1424', borderWidth: 2 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: {color:'#94a3b8', font:{size:9}} } }, cutout: '65%' }
        });
    }

    // 3. Revenue Pie
    const ctxRev = document.getElementById('finRevChart');
    if (ctxRev) {
        financeCharts.rev = new Chart(ctxRev.getContext('2d'), {
            type: 'pie',
            data: {
                labels: Object.keys(revByCat).length ? Object.keys(revByCat) : ['No Data'],
                datasets: [{ data: Object.values(revByCat).length ? Object.values(revByCat) : [1], backgroundColor: ['#34d399', '#10b981', '#059669', '#047857', '#064e3b'], borderColor: '#0a1424', borderWidth: 2 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: {color:'#94a3b8', font:{size:9}} } } }
        });
    }

    // 4. Profit Margin Horizontal Bar
    const ctxMargin = document.getElementById('finMarginChart');
    if (ctxMargin) {
        financeCharts.margin = new Chart(ctxMargin.getContext('2d'), {
            type: 'bar',
            data: {
                labels: ['Revenue', 'Expense', 'Profit'],
                datasets: [{
                    data: [tRev, tExp, nProf],
                    backgroundColor: ['#34d399', '#fb7185', nProf >= 0 ? '#60a5fa' : '#e11d48'],
                    borderRadius: 4
                }]
            },
            options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x:{grid:{color:'rgba(255,255,255,0.05)'}}, y:{grid:{display:false}} } }
        });
    }
}

// ACTION: SAVE & DELETE FINANCE
// =================================================================
async function saveFinanceRecord() {
    const id = document.getElementById('finId').value;
    const isEdit = !!id;
    const subject = document.getElementById('finSubj').value.trim();
    if (!subject) { ui.error('Deskripsi transaksi wajib diisi!'); return; }

    const valStr = document.getElementById('finVal').value;
    const value = Number(valStr.replace(/\D/g, '')) || 0;
    if (value <= 0) { ui.error('Nominal harus lebih dari 0!'); return; }

    const stage = document.getElementById('finType').value;
    const pd = {
        date: document.getElementById('finDate').value,
        category: document.getElementById('finCategory').value,
        pic: document.getElementById('finPic').value.trim()
    };

    const payloadData = {
        id: isEdit ? id : 'FIN-' + Math.floor(Math.random() * 1000000),
        moduleKey: 'Mod_Finance', subject: subject, stage: stage, value: value,
        payload: JSON.stringify(pd), pd: JSON.stringify(pd)
    };

    ui.loader(true, "Saving Transaction...");
    const actionAPI = isEdit ? 'EDIT_RECORD' : 'ADD_RECORD';
    const res = await fetchAPI(actionAPI, payloadData);
    ui.loader(false);

    if (res.success) {
        if (!appCache['Mod_Finance']) appCache['Mod_Finance'] = [];
        if (isEdit) {
            const idx = appCache['Mod_Finance'].findIndex(x => x.id === id);
            if (idx > -1) appCache['Mod_Finance'][idx] = payloadData;
        } else { appCache['Mod_Finance'].unshift(payloadData); }
        renderFinance(document.getElementById('dynamicContentArea'), appCache['Mod_Finance']);
        Swal.close();
        ui.notify("Transaksi Tersimpan!");
    } else { ui.error(res.message); }
}

async function deleteFinanceRecord(id) {
    ui.confirm('Delete Transaction?', 'Data transaksi akan dihapus dan perhitungan ROI akan berubah.', 'Yes, Delete', 'rose').then(async (result) => {
        if (result.isConfirmed) {
            ui.loader(true, "Deleting...");
            const res = await fetchAPI('DELETE_RECORD', { id, moduleKey: 'Mod_Finance' });
            ui.loader(false);
            if (res.success) {
                appCache['Mod_Finance'] = appCache['Mod_Finance'].filter(x => x.id !== id);
                renderFinance(document.getElementById('dynamicContentArea'), appCache['Mod_Finance']);
                ui.notify("Transaksi Dihapus!");
            } else { ui.error(res.message); }
        }
    });
}

       async function submitB2CDealForm() {
    const subject = document.getElementById('b2cSubject').value.trim();
    const valStr = document.getElementById('b2cValue').value;
    const value = Number(valStr.replace(/\D/g, '')) || 0;
    if (!subject) { ui.error('Nama Pelanggan wajib diisi!'); return; }

    // --- PERBAIKAN TYPO: Mengubah 'b2bProb' menjadi 'b2cProb' ---
    const prob = Number(document.getElementById('b2cProb').value) || 0;
    const stage = document.getElementById('b2cStage').value;
    const desc = document.getElementById('b2cDesc').value.trim();
    const email = document.getElementById('b2cEmail').value.trim();
    const phone = document.getElementById('b2cPhone').value.trim();
    const sosmed = document.getElementById('b2cSosmed').value.trim();

    // --- LOGIC FOLLOW UP B2C ---
    const followUps = [];
    document.querySelectorAll('#b2cFollowUpContainer > div').forEach(row => {
        const freq = row.querySelector('.fu-freq').value;
        const date = row.querySelector('.fu-date').value;
        const note = row.querySelector('.fu-note').value.trim();
        if(date && note) followUps.push({ freq, date, note });
    });

    const score = prob >= 70 ? 'HOT' : (prob >= 40 ? 'WARM' : 'COLD');
    
    // Format Payload Khusus B2C
    const jsonDetails = JSON.stringify({ 
        prob: prob, 
        score: score,
        desc: desc,
        email: email,
        phone: phone,
        sosmed: sosmed,
        pic: appState.name,
        followUps: followUps,
        nextMeeting: followUps.length > 0 ? followUps[followUps.length - 1].date : "-" 
    });
    
    const newRecord = {
        id: 'B2C-' + Math.floor(Math.random() * 1000000),
        moduleKey: appState.activeModule,
        subject: subject,
        stage: stage,
        value: value,
        pd: jsonDetails,     
        payload: jsonDetails 
    };

    Swal.close(); 
    ui.loader(true, "Saving Consumer to Database...");
    const res = await fetchAPI('ADD_RECORD', newRecord);
    ui.loader(false);

    if (res.success) {
        if(!appCache[appState.activeModule]) appCache[appState.activeModule] = [];
        appCache[appState.activeModule].unshift(newRecord); 
        
        renderB2CMatrix(document.getElementById('dynamicContentArea'), appCache[appState.activeModule]);
        ui.notify("Customer Berhasil Disimpan!");
    } else {
        ui.error(res.message || "Gagal menyimpan Customer.");
    }
}

        async function updateB2CDealStage(id) {
            const dealList = appCache['Mod_B2CMatrix'];
            const dealIndex = dealList.findIndex(d => d.id === id);
            if (dealIndex === -1) return;
            const deal = dealList[dealIndex];

            // 1. Tangkap Input Dasar
            const newStage = document.getElementById('updateStageSelect').value;
            const valStr = document.getElementById('updateValue').value;
            const value = Number(valStr.replace(/\D/g, '')) || 0;
            const prob = Number(document.getElementById('updateProb').value) || 0;
            const score = prob >= 70 ? 'HOT' : (prob >= 40 ? 'WARM' : 'COLD');
            
            const desc = document.getElementById('updateDesc').value.trim();
            const phone = document.getElementById('updatePhone').value.trim();
            const email = document.getElementById('updateEmail').value.trim();
            
            // Tangkap Tipe & Link Sosmed secara aman
            const sosmedTypeEl = document.getElementById('updateSosmedType');
            const sosmedLinkEl = document.getElementById('updateSosmedLink') || document.getElementById('updateSosmed');
            const sosmedType = sosmedTypeEl ? sosmedTypeEl.value : 'Instagram';
            const sosmedLink = sosmedLinkEl ? sosmedLinkEl.value.trim() : '';

            // 2. 📍 TANGKAP PERUBAHAN LOG FOLLOW-UP DINAMIS
            const followUps = [];
            document.querySelectorAll('#detailB2CFollowUpContainer > div').forEach(row => {
                const freq = row.querySelector('.fu-freq').value;
                const date = row.querySelector('.fu-date').value;
                const note = row.querySelector('.fu-note').value.trim();
                if(date && note) followUps.push({ freq, date, note });
            });

            // 3. Susun JSON Payload
            let pd = JSON.parse(deal.pd || '{}');
            pd = { 
                ...pd, 
                prob, 
                score, 
                desc, 
                phone, 
                email, 
                sosmed: { type: sosmedType, link: sosmedLink },
                followUps: followUps,
                nextMeeting: followUps.length > 0 ? followUps[followUps.length - 1].date : "-" 
            };

            const updatedData = {
                id: deal.id,
                moduleKey: 'Mod_B2CMatrix',
                subject: deal.subject || deal.sb, 
                stage: newStage,
                value: value,
                payload: pd 
            };

            ui.loader(true, "Updating Consumer Pipeline...");
            const res = await fetchAPI('EDIT_RECORD', updatedData);
            ui.loader(false);

            if(res.success) {
                // 4. Perbarui Memori Lokal
                dealList[dealIndex] = { ...deal, stage: newStage, st: newStage, value: value, vl: value, pd: JSON.stringify(pd) };
                
                // 5. Render Ulang Antarmuka
                renderB2CMatrix(document.getElementById('dynamicContentArea'), dealList);
                openB2CDealDetail(id); 
                
                Swal.fire({
                    icon: 'success', title: 'Pipeline Updated!',
                    text: `Konsumen dipindahkan ke tahap: ${newStage}`,
                    background: '#0f172a', color: '#fff', confirmButtonColor: '#10b981'
                });
            } else {
                ui.error(res.message || "Gagal memperbarui database.");
            }
        }

function closeCRM360() {
    const overlay = document.getElementById('crmDrawerOverlay');
    const drawer = document.getElementById('crmDrawer');
    drawer.classList.add('translate-x-full');
    overlay.classList.add('opacity-0');
    setTimeout(() => { overlay.classList.add('hidden'); }, 300);
}

function switchCRMTab(tabId) {
    // Hide all tabs
    ['tabFeedback', 'tabTickets', 'tabTimeline'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
        document.getElementById(id).classList.remove('block');
    });
    // Remove active class from buttons
    document.querySelectorAll('.crm-tab-btn').forEach(btn => btn.classList.remove('active'));
    
    // Show selected
    document.getElementById(tabId).classList.remove('hidden');
    document.getElementById(tabId).classList.add('block');
    event.currentTarget.classList.add('active');
}

// CRM ACTION FUNCTIONS (UPDATE JSON PAYLOAD & HIT API)

async function executeCRMSave(id, newPayload, successMsg) {
    const dataList = appCache['Mod_CRM'] || [];
    const dealIndex = dataList.findIndex(d => d.id === id);
    if (dealIndex === -1) return;
    const deal = dataList[dealIndex];

    const updatedData = {
        id: deal.id,
        moduleKey: 'Mod_CRM',
        // --- [REVISI PENANGKAPAN DATA CACHE] ---
        subject: deal.subject || deal.sb, 
        stage: deal.stage || deal.st,
        value: deal.value || deal.vl,
        // ---------------------------------------
        payload: newPayload
    };

    ui.loader(true, "Updating CRM Record...");
    const res = await fetchAPI('EDIT_RECORD', updatedData);
    ui.loader(false);

    if(res.success) {
        dataList[dealIndex] = { ...deal, pd: JSON.stringify(newPayload) };
        renderCRM(document.getElementById('dynamicContentArea'), dataList);
        ui.notify(successMsg);
        openCRM360(id); // Reload Drawer
    } else {
        ui.error(res.message || "Gagal update data CRM.");
    }
}
function saveCRMFeedback() {
    const id = document.getElementById('crmActiveId').value;
    const deal = appCache['Mod_CRM'].find(d => d.id === id);
    let pd = JSON.parse(deal.pd || '{}');

    pd.feedback = {
        experience: document.getElementById('crmExp').value,
        quality: document.getElementById('crmQual').value,
        comfort: document.getElementById('crmComf').value,
        notes: document.getElementById('crmNotes').value.trim()
    };
    pd.health = document.getElementById('crmHealth').value;

    executeCRMSave(id, pd, "Profil CRM Diperbarui!");
}

function addCRMTicket() {
    const id = document.getElementById('crmActiveId').value;
    const subj = document.getElementById('tktSubj').value.trim();
    if(!subj) return;
    const prio = document.getElementById('tktPrio').value;

    const deal = appCache['Mod_CRM'].find(d => d.id === id);
    let pd = JSON.parse(deal.pd || '{}');
    if(!pd.tickets) pd.tickets = [];
    if(!pd.timeline) pd.timeline = [];

    pd.tickets.push({ subject: subj, prio: prio, status: 'Open', date: new Date().toISOString().split('T')[0] });
    pd.timeline.push({ date: new Date().toISOString().split('T')[0], note: `Ticket Created: ${subj} (${prio} Prio)`, type: 'System' });

    executeCRMSave(id, pd, "Ticket Berhasil Dibuat!");
}

function resolveCRMTicket(idx) {
    const id = document.getElementById('crmActiveId').value;
    const deal = appCache['Mod_CRM'].find(d => d.id === id);
    let pd = JSON.parse(deal.pd || '{}');
    
    pd.tickets[idx].status = 'Resolved';
    pd.timeline.push({ date: new Date().toISOString().split('T')[0], note: `Ticket Resolved: ${pd.tickets[idx].subject}`, type: 'System' });

    executeCRMSave(id, pd, "Ticket Ditutup!");
}

function addCRMTimeline() {
    const id = document.getElementById('crmActiveId').value;
    const note = document.getElementById('tlNote').value.trim();
    if(!note) return;

    const deal = appCache['Mod_CRM'].find(d => d.id === id);
    let pd = JSON.parse(deal.pd || '{}');
    if(!pd.timeline) pd.timeline = [];

    pd.timeline.push({ date: new Date().toISOString().split('T')[0], note: note, type: 'Manual' });

    executeCRMSave(id, pd, "Log Timeline Disimpan!");
}

function savePartnerRecord() {
    const id = document.getElementById('partId').value;
    const isEdit = !!id;
    const subject = document.getElementById('partSubj').value.trim();
    if (!subject) { ui.error('Nama partner wajib diisi!'); return; }

    const stage = document.getElementById('partStage').value;
    
    let existingValue = 0;
    let existingPd = {};
    if (isEdit) {
        const d = appCache['Mod_Partnership'].find(x => x.id === id);
        if(d) {
            existingValue = Number(d.value || d.vl) || 0;
            existingPd = JSON.parse(d.pd || '{}');
        }
    }

    // Tangkap data tambahan (desc, web)
    const pd = {
        ...existingPd,
        type: document.getElementById('partType').value,
        tier: document.getElementById('partTier').value,
        email: document.getElementById('partEmail').value.trim(),
        phone: document.getElementById('partPhone').value.trim(),
        comRate: Number(document.getElementById('partComRate').value) || 0,
        refCode: document.getElementById('partRef').value.trim(),
        desc: document.getElementById('partDesc').value.trim(),
        web: document.getElementById('partWeb').value.trim()
    };

    if(!isEdit) {
        pd.leads = 0; pd.conv = 0; pd.paidOut = 0; 
        pd.timeline = [{date: new Date().toISOString().split('T')[0], note:'Partner Onboarded', type:'System'}];
    }

    Swal.close();
    executePartnerSave(id, isEdit, subject, stage, existingValue, pd, isEdit ? "Partner Updated!" : "Partner Onboarded!");
}

async function executePartnerSave(id, isEdit, subject, stage, value, pdObj, successMsg) {
    const payloadData = {
        id: isEdit ? id : 'PART-' + Math.floor(Math.random() * 1000000),
        moduleKey: 'Mod_Partnership',
        subject: subject,
        stage: stage,
        value: value,
        payload: JSON.stringify(pdObj),
        pd: JSON.stringify(pdObj)
    };

    ui.loader(true, "Updating Ecosystem...");
    const actionAPI = isEdit ? 'EDIT_RECORD' : 'ADD_RECORD';
    const res = await fetchAPI(actionAPI, payloadData);
    ui.loader(false);

    if (res.success) {
        if (!appCache['Mod_Partnership']) appCache['Mod_Partnership'] = [];
        if (isEdit) {
            const idx = appCache['Mod_Partnership'].findIndex(x => x.id === id);
            if (idx > -1) appCache['Mod_Partnership'][idx] = payloadData;
        } else {
            appCache['Mod_Partnership'].unshift(payloadData);
        }
        renderPartnership(document.getElementById('dynamicContentArea'), appCache['Mod_Partnership']);
        ui.notify(successMsg);
    } else {
        ui.error(res.message || "Gagal menyimpan data.");
    }
}


function logPartnerConversion() {
    const id = document.getElementById('partActiveId').value;
    const dealValStr = document.getElementById('newLeadVal').value;
    const dealVal = Number(dealValStr.replace(/\D/g, '')) || 0;
    if (dealVal <= 0) { ui.error('Masukkan nilai deal valid!'); return; }

    const partner = appCache['Mod_Partnership'].find(d => d.id === id);
    let pd = JSON.parse(partner.pd || '{}');
    let currentValue = Number(partner.value || partner.vl) || 0;

    pd.leads = (Number(pd.leads) || 0) + 1;
    pd.conv = (Number(pd.conv) || 0) + 1;
    let newValue = currentValue + dealVal;
    
    let comEarned = dealVal * ((Number(pd.comRate)||0) / 100);

    if(!pd.timeline) pd.timeline = [];
    pd.timeline.push({ date: new Date().toISOString().split('T')[0], note: `New Conversion! Deal: ${ui.formatRp(dealVal)}. Com Earned: ${ui.formatRp(comEarned)}`, type: 'System' });

    executePartnerSave(id, true, partner.subject || partner.sb, partner.stage || partner.st, newValue, pd, "Conversion Berhasil Dilacak!").then(() => {
        openPartner360(id); // reload drawer
    });
}

function logPartnerPayout() {
    const id = document.getElementById('partActiveId').value;
    const partner = appCache['Mod_Partnership'].find(d => d.id === id);
    let pd = JSON.parse(partner.pd || '{}');
    
    let rev = Number(partner.value || partner.vl) || 0;
    let paidOut = Number(pd.paidOut) || 0;
    let comRate = Number(pd.comRate) || 0;
    let pendingCom = (rev * (comRate/100)) - paidOut;

    if (pendingCom <= 0) { ui.error('Tidak ada komisi pending untuk dicairkan.'); return; }

    ui.confirm('Cairkan Komisi?', `Proses payout komisi sebesar <b class="text-emerald-400 font-mono text-xs ml-1">${ui.formatRp(pendingCom)}</b> akan dicatat secara permanen ke dalam sistem.`, 'Proses Payout', 'emerald').then((result) => {
        if (result.isConfirmed) {
            pd.paidOut = paidOut + pendingCom;
            if(!pd.timeline) pd.timeline = [];
            pd.timeline.push({ date: new Date().toISOString().split('T')[0], note: `Payout Processed: ${ui.formatRp(pendingCom)}`, type: 'Payout' });
            
            executePartnerSave(id, true, partner.subject || partner.sb, partner.stage || partner.st, rev, pd, "Payout Berhasil Dicatat!").then(() => openPartner360(id));
        }
    });
}
function logPartnerActivity() {
    const id = document.getElementById('partActiveId').value;
    const note = document.getElementById('partNote').value.trim();
    if(!note) return;

    const partner = appCache['Mod_Partnership'].find(d => d.id === id);
    let pd = JSON.parse(partner.pd || '{}');
    if(!pd.timeline) pd.timeline = [];
    pd.timeline.push({ date: new Date().toISOString().split('T')[0], note: note, type: 'Manual' });

    executePartnerSave(id, true, partner.subject || partner.sb, partner.stage || partner.st, partner.value || partner.vl, pd, "Aktivitas Disimpan!").then(() => openPartner360(id));
}

        async function submitB2BForm() {
            const subject = document.getElementById('b2bSubject').value.trim();
            const valStr = document.getElementById('b2bValue').value;
            const value = Number(valStr.replace(/\D/g, '')) || 0;
            if (!subject) { ui.error('Nama Klien / Perusahaan wajib diisi!'); return; }

            const prob = Number(document.getElementById('b2bProb').value) || 0;
            const stage = document.getElementById('b2bStage').value;
            const desc = document.getElementById('b2bDesc').value.trim();
            const category = document.getElementById('b2bCategory').value; // 📍 TAMBAHAN TANGKAP 
            const startRes = document.getElementById('b2bStartRes').value;
            const endRes = document.getElementById('b2bEndRes').value;
            const noContact = document.getElementById('b2bNoContact').value.trim();
            const noPic = document.getElementById('b2bNoPic').value.trim();
            const web = document.getElementById('b2bWeb').value.trim();
            const sosmedType = document.getElementById('b2bSosmedType').value;
            const sosmedLink = document.getElementById('b2bSosmedLink').value.trim();

            const followUps = [];
            document.querySelectorAll('#b2bFollowUpContainer > div').forEach(row => {
                const freq = row.querySelector('.fu-freq').value;
                const date = row.querySelector('.fu-date').value;
                const note = row.querySelector('.fu-note').value.trim();
                if(date && note) followUps.push({ freq, date, note });
            });

            const score = prob >= 70 ? 'HOT' : (prob >= 40 ? 'WARM' : 'COLD');
            
       // Bungkus Data Kompleks ke JSON (Ditambahkan variabel 'category')
            const jsonDetails = JSON.stringify({ 
                prob, score, desc, category, startRes, endRes, noContact, noPic, web,
                sosmed: { type: sosmedType, link: sosmedLink },
                followUps: followUps,
                pic: appState.name // Ambil nama dari login state
            });
            
            
            const newRecord = {
                id: 'B2B-' + Math.floor(Math.random() * 1000000),
                moduleKey: appState.activeModule,
                subject: subject,
                stage: stage,

        async function updateDealStage(id) {
            const dealList = appCache['Mod_B2BMatrix'];
            const dealIndex = dealList.findIndex(d => d.id === id);
            if (dealIndex === -1) return;
            const deal = dealList[dealIndex];

            const valStr = document.getElementById('updateValue').value;
            const value = Number(valStr.replace(/\D/g, '')) || 0;
            const prob = Number(document.getElementById('updateProb').value) || 0;
            const score = prob >= 70 ? 'HOT' : (prob >= 40 ? 'WARM' : 'COLD');
            
            const desc = document.getElementById('updateDesc').value.trim();
            const category = document.getElementById('updateCategory').value; // 📍 TANGKAP KATEGORI

            const endRes = document.getElementById('updateEndRes').value;
            const web = document.getElementById('updateWeb').value.trim();
            const sosmedType = document.getElementById('updateSosmedType').value;
            const sosmedLink = document.getElementById('updateSosmedLink').value.trim();

            const followUps = [];
            document.querySelectorAll('#detailFollowUpContainer > div').forEach(row => {
                const freq = row.querySelector('.fu-freq').value;
                const date = row.querySelector('.fu-date').value;
                const note = row.querySelector('.fu-note').value.trim();
                if(date && note) followUps.push({ freq, date, note });
            });

            // Timpa JSON Lama dengan Data Baru
            let pd = JSON.parse(deal.pd || '{}');
            pd = { ...pd, prob, score, desc, category, noContact, noPic, startRes, endRes, web, sosmed: { type: sosmedType, link: sosmedLink }, followUps: followUps, nextMeeting: followUps.length > 0 ? followUps[followUps.length - 1].date : "-" };

            const updatedData = {
                id: deal.id,
                moduleKey: 'Mod_B2BMatrix',
                subject: deal.subject || deal.sb, 
                stage: newStage,
                value: value,
                payload: pd // Disimpan ke Google Sheets
            };

            ui.loader(true, "Updating Pipeline...");
            const res = await fetchAPI('EDIT_RECORD', updatedData);
            ui.loader(false);

            if(res.success) {
                // Update Local Cache
                dealList[dealIndex] = { ...deal, stage: newStage, st: newStage, value: value, vl: value, pd: JSON.stringify(pd) };
                
                renderB2BMatrix(document.getElementById('dynamicContentArea'), dealList);
                openDealDetail(id); 
                
                Swal.fire({
                    icon: 'success', title: 'Pipeline Updated!',
                    text: `${updatedData.subject} bergeser ke tahap: ${newStage}`,
                    background: '#0f172a', color: '#fff', confirmButtonColor: '#10b981'
                });
            } else {
                ui.error(res.message || "Gagal memperbarui status ke database.");
            }
        }

        async function saveB2CRecord() {
            const id = document.getElementById('b2cId').value;
            const isEdit = !!id;
            const subject = document.getElementById('b2cSubject').value.trim();
            const stage = document.getElementById('b2cStage').value;
            const pic = document.getElementById('b2cPic').value.trim();
            
            const cacStr = document.getElementById('b2cCac').value;
            const cac = Number(cacStr.replace(/\D/g, '')) || 0;
            
            const ltvStr = document.getElementById('b2cLtv').value;
            const ltv = Number(ltvStr.replace(/\D/g, '')) || 0;

            if (!subject) { ui.error('Nama Cabang/Node wajib diisi!'); return; }

            const jsonDetails = JSON.stringify({ cac, ltv, pic, health: (cac > ltv ? 'Loss' : 'Profitable') });

            const payloadData = {
                id: isEdit ? id : 'B2C-' + Math.floor(Math.random() * 1000000),
                moduleKey: 'Mod_B2CExpansion',
                subject: subject,
                stage: stage,
                value: ltv, // Gunakan LTV sebagai valuasi utama node
                payload: jsonDetails,
                pd: jsonDetails
            };

            Swal.close();
            ui.loader(true, isEdit ? "Updating Node..." : "Saving New Node...");
            
            const actionAPI = isEdit ? 'EDIT_RECORD' : 'ADD_RECORD';
            const res = await fetchAPI(actionAPI, payloadData);
            
            ui.loader(false);

            if (res.success) {
                if (!appCache['Mod_B2CExpansion']) appCache['Mod_B2CExpansion'] = [];
                
                if (isEdit) {
                    const idx = appCache['Mod_B2CExpansion'].findIndex(x => x.id === id);
                    if (idx > -1) appCache['Mod_B2CExpansion'][idx] = payloadData;
                } else {
                    appCache['Mod_B2CExpansion'].unshift(payloadData); 
                }
                
                renderB2CExpansion(document.getElementById('dynamicContentArea'), appCache['Mod_B2CExpansion']);
                ui.notify(isEdit ? "Node Updated!" : "New Node Saved!");
            } else {
                ui.error(res.message || "Gagal menyimpan data.");
            }
        }

     async function deleteB2CRecord(id) {
    ui.confirm('Hapus Cabang / Node?', 'Data cabang dan unit ekonomi ini akan dihapus secara permanen dari database.', 'Ya, Hapus Cabang', 'rose').then(async (result) => {
        if (result.isConfirmed) {
            ui.loader(true, "Deleting Node...");
            const res = await fetchAPI('DELETE_RECORD', { id, moduleKey: 'Mod_B2CExpansion' });
            ui.loader(false);
            if (res.success) {
                appCache['Mod_B2CExpansion'] = appCache['Mod_B2CExpansion'].filter(x => x.id !== id);
                renderB2CExpansion(document.getElementById('dynamicContentArea'), appCache['Mod_B2CExpansion']);
                ui.notify("Node Cabang Berhasil Dihapus!");
            } else { ui.error(res.message); }
        }
    });
}

function renderWarRoom(container, data) {
    const b2bData = appCache['Mod_B2BMatrix'] || [];
    const b2cData = appCache['Mod_B2CExpansion'] || [];
    const b2cMatrixData = appCache['Mod_B2CMatrix'] || [];
    const mouData = appCache['Mod_MOUTracker'] || [];
    const crmData = appCache['Mod_CRM'] || [];
    const intelData = appCache['Mod_MarketIntel'] || [];

    // 1. Perhitungan B2B Metrics & Funnel
    let pipelineValue = 0;
    let closedWonValue = 0;
    const stageCounts = {};

    b2bData.forEach(d => {
        const val = Number(d.value || d.vl) || 0;
        const stage = d.stage || d.st || 'Lead Baru';
        
        if (stage === 'Deal Won' || stage === 'Deal Closed') {
            closedWonValue += val;
        } else if (stage !== 'Deal Lost' && stage !== 'Terminated') {
            pipelineValue += val;
        }

        if (stageCounts[stage] !== undefined) stageCounts[stage]++;
        else stageCounts[stage] = 1;
    });

    // 2. Perhitungan B2C Active Nodes
    let activeNodes = 0;
    const nodeNames = [];
    const nodeCACs = [];
    const nodeLTVs = [];

    b2cData.forEach(d => {
        const stage = (d.stage || d.st || '').toLowerCase();
        let pd = JSON.parse(d.pd || '{}');
        
        if (stage !== 'closed' && stage !== 'terminated') {
            activeNodes++;
        }

        nodeNames.push((d.subject || d.sb || 'Node').substring(0, 12));
        nodeCACs.push(Number(pd.cac) || 0);
        nodeLTVs.push(Number(pd.ltv) || Number(d.value || d.vl) || 0);
    });

    // 3. Perhitungan Data B2C Matrix
    let totalB2CValue = 0;
    const b2cMatrixStages = {};
    b2cMatrixData.forEach(d => {
        const val = Number(d.value || d.vl) || 0;
        const stage = d.stage || d.st || 'Lead Baru';
        totalB2CValue += val;

        if (b2cMatrixStages[stage]) b2cMatrixStages[stage]++;
        else b2cMatrixStages[stage] = 1;
    });

    // 4. Perhitungan Data MOU Contract Expiry Status
    const today = new Date();
    let totalMOUValue = 0;
    let mouActiveCount = 0;
    let mouExpiringSoonCount = 0;
    let mouExpiredCount = 0;

    mouData.forEach(d => {
        const val = Number(d.value || d.vl) || 0;
        const stage = d.stage || d.st || 'Drafting';
        let pd = JSON.parse(d.pd || '{}');
        let expiryDate = new Date(pd.expiry || today);
        let daysRemaining = Math.ceil((expiryDate - today) / (1000 * 60 * 60 * 24));

        if (stage === 'Active') {
            totalMOUValue += val;
            if (daysRemaining <= 30 && daysRemaining > 0) mouExpiringSoonCount++;
            else if (daysRemaining <= 0) mouExpiredCount++;
            else mouActiveCount++;
        }
    });

    // 5. Perhitungan Data Customer Health (CRM)
    let healthyCount = 0;
    let warningCount = 0;
    let atRiskCount = 0;

    crmData.forEach(d => {
        let pd = JSON.parse(d.pd || '{}');
        let fb = pd.feedback || { experience: 0, quality: 0, comfort: 0 };
        let avgCSAT = Math.round((Number(fb.experience) + Number(fb.quality) + Number(fb.comfort)) / 3) || 0;

        if (pd.health === 'At Risk' || avgCSAT < 50) atRiskCount++;
        else if (pd.health === 'Warning' || avgCSAT < 75) warningCount++;
        else healthyCount++;
    });

    // 6. Market Intelligence Competitor Data
    let radarLabels = [];
    let radarData = [];
    let highThreats = 0;

    const topCompetitors = [...intelData].sort((a, b) => {
        const sA = Number(JSON.parse(a.pd || '{}').score) || 0;
        const sB = Number(JSON.parse(b.pd || '{}').score) || 0;
        return sB - sA; 
    }).slice(0, 6);

        let pd = JSON.parse(d.pd || '{}');
        radarLabels.push((d.subject || d.sb || 'Rival').substring(0, 12));

// INITIALIZER 7 GRAFIK ENTERPRISE WAR ROOM (CHART.JS)

    nodeNames, nodeCACs, nodeLTVs,
    healthyCount, warningCount, atRiskCount,
    mouActive, mouExpiring, mouExpired
) {
    if (typeof Chart === 'undefined') return;

    Chart.defaults.color = '#94a3b8';
    Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";

    // Hancurkan chart lama jika re-render
    Object.keys(warRoomCharts).forEach(key => {

    });

    // 1. CHART B2B PIPELINE FUNNEL (Horizontal Bar)

        let labels = Object.keys(b2bStages);

        warRoomCharts.pipeline = new Chart(ctxFunnel.getContext('2d'), {
            type: 'bar',

                labels: labels,
                datasets: [{

// FUNGSI SIMPAN MARKET INTELLIGENCE DENGAN DOKUMEN FIELD BARU
async function saveMarketIntelRecord() {
    const id = document.getElementById('miId').value;
    const isEdit = !!id;
    const subject = document.getElementById('miSubject').value.trim();
    const stage = document.getElementById('miStage').value;
    const valStr = document.getElementById('miValue').value;
    const value = Number(valStr.replace(/\D/g, '')) || 0;

    const category = document.getElementById('miCategory').value.trim();
    const web = document.getElementById('miWeb').value.trim();
    const desc = document.getElementById('miDesc').value.trim();
    const strengths = document.getElementById('miStr').value;
    const weaknesses = document.getElementById('miWk').value;
    const score = document.getElementById('miScore').value;

    if (!subject) { ui.error('Nama Kompetitor wajib diisi!'); return; }

    const jsonDetails = JSON.stringify({ strengths, weaknesses, score, desc, category, web });

    const payloadData = {
        id: isEdit ? id : 'COMP-' + Math.floor(Math.random() * 1000000),
        moduleKey: 'Mod_MarketIntel',
        subject: subject,
        stage: stage,
        value: value,
        payload: jsonDetails,
        pd: jsonDetails
    };

    Swal.close();
    ui.loader(true, isEdit ? "Updating Battlecard..." : "Saving Competitor...");

    const actionAPI = isEdit ? 'EDIT_RECORD' : 'ADD_RECORD';
    const res = await fetchAPI(actionAPI, payloadData);

    ui.loader(false);

    if (res.success) {
        if (!appCache['Mod_MarketIntel']) appCache['Mod_MarketIntel'] = [];

        if (isEdit) {
            const idx = appCache['Mod_MarketIntel'].findIndex(x => x.id === id);
            if (idx > -1) appCache['Mod_MarketIntel'][idx] = payloadData;
        } else {
            appCache['Mod_MarketIntel'].unshift(payloadData);
        }

        renderMarketIntel(document.getElementById('dynamicContentArea'), appCache['Mod_MarketIntel']);
        ui.notify(isEdit ? "Battlecard Updated!" : "Competitor Tracked!");
    } else {
        ui.error(res.message || "Gagal menyimpan data.");
    }
}
       async function deleteMarketIntelRecord(id) {
    ui.confirm('Delete Competitor?', 'Data battlecard dan analisis kompetitor ini akan dihapus permanen.', 'Yes, Delete', 'rose').then(async (result) => {
        if (result.isConfirmed) {
            ui.loader(true, "Deleting Data...");
            const res = await fetchAPI('DELETE_RECORD', { id, moduleKey: 'Mod_MarketIntel' });
            ui.loader(false);
            if (res.success) {
                appCache['Mod_MarketIntel'] = appCache['Mod_MarketIntel'].filter(x => x.id !== id);
                renderMarketIntel(document.getElementById('dynamicContentArea'), appCache['Mod_MarketIntel']);
                ui.notify("Competitor Deleted!");
            } else { ui.error(res.message); }
        }
    });
}

        async function saveMOURecord() {
            const id = document.getElementById('mouId').value;
            const isEdit = !!id;
            const subject = document.getElementById('mouSubject').value.trim();
            const stage = document.getElementById('mouStage').value;
            const valStr = document.getElementById('mouValue').value;
            const value = Number(valStr.replace(/\D/g, '')) || 0;
            
            const sign = document.getElementById('mouSign').value;
            const expiry = document.getElementById('mouExpiry').value;
            const type = document.getElementById('mouType').value;
            const pic = document.getElementById('mouPic').value.trim();

            if (!subject || !sign || !expiry) { ui.error('Nama Partner, Tgl Sign, dan Expiry wajib diisi!'); return; }

            const jsonDetails = JSON.stringify({ sign, expiry, type, pic });

            const payloadData = {
                id: isEdit ? id : 'MOU-' + Math.floor(Math.random() * 1000000),
                moduleKey: 'Mod_MOUTracker',
                subject: subject,
                stage: stage,
                value: value,
                payload: jsonDetails,
                pd: jsonDetails
            };

            Swal.close();
            ui.loader(true, isEdit ? "Updating Contract..." : "Saving Contract...");
            
            const actionAPI = isEdit ? 'EDIT_RECORD' : 'ADD_RECORD';
            const res = await fetchAPI(actionAPI, payloadData);
            
            ui.loader(false);

            if (res.success) {
                if (!appCache['Mod_MOUTracker']) appCache['Mod_MOUTracker'] = [];
                
                if (isEdit) {
                    const idx = appCache['Mod_MOUTracker'].findIndex(x => x.id === id);
                    if (idx > -1) appCache['Mod_MOUTracker'][idx] = payloadData;
                } else {
                    appCache['Mod_MOUTracker'].unshift(payloadData); 
                }
                
                renderMOUTracker(document.getElementById('dynamicContentArea'), appCache['Mod_MOUTracker']);
                ui.notify(isEdit ? "Contract Updated!" : "Contract Saved!");
                checkNotifications(); // Re-check if the new contract triggers H-30 warning
            } else {
                ui.error(res.message || "Gagal menyimpan data.");
            }
        }

        async function deleteMOURecord(id) {
    ui.confirm('Delete Contract?', 'Dokumen kontrak ini akan dihapus dan tracking H-30 akan dihentikan secara permanen.', 'Yes, Delete Contract', 'rose').then(async (result) => {
        if (result.isConfirmed) {
            ui.loader(true, "Deleting Contract...");
            const res = await fetchAPI('DELETE_RECORD', { id, moduleKey: 'Mod_MOUTracker' });
            ui.loader(false);
            if (res.success) {
                appCache['Mod_MOUTracker'] = appCache['Mod_MOUTracker'].filter(x => x.id !== id);
                renderMOUTracker(document.getElementById('dynamicContentArea'), appCache['Mod_MOUTracker']);
                ui.notify("Contract Deleted!");
                checkNotifications();
            } else { ui.error(res.message); }
        }
    });
}

        // --- 8. GLOBAL UTILITIES (EXPORT & NOTIF) ---
        function checkNotifications() {
            // Logic: Check if MOU expires in 30 days
            const mous = appCache['Mod_MOUTracker'] || [];
            let alertCount = 0;
            const today = new Date();
            mous.forEach(m => {
                let pd = JSON.parse(m.pd || '{}');
                if(pd.expiry) {
                    const expDate = new Date(pd.expiry);
                    const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
                    if(diffDays <= 30 && diffDays > 0) alertCount++;
                }
            });

            const badge = document.getElementById('notifBadge');
            if(alertCount > 0) {
                badge.classList.remove('hidden');
                ui.notify(`Warning: ${alertCount} Contracts expiring soon!`, 'warning');
            }
        }

window.exportCSV = function() {
    const modKey = appState.activeModule;
    const data = appCache[modKey] || [];
    
    const escapeCSV = (str) => '"' + String(str || '').replace(/"/g, '""').replace(/\n/g, ' ') + '"';
    let headers = [];
    let rows = [];

    if (typeof ui !== 'undefined') ui.loader(true, "Membentuk Berkas CSV...");

    try {
        switch (modKey) {
            case 'Mod_B2BMatrix':
                headers = ["ID Deal", "Nama Perusahaan / Client", "Stage Pipeline", "Nilai Valuasi (Rp)", "Win Probability (%)", "Kategori Industri", "PIC", "No Office", "WhatsApp PIC", "Website", "Link Sosmed"];
                rows = data.map(d => {
                    let pd = JSON.parse(d.pd || '{}');
                    return [
                        escapeCSV(d.id),
                        escapeCSV(d.subject || d.sb),
                        escapeCSV(d.stage || d.st),
                        Number(d.value || d.vl) || 0,
                        (pd.prob || 0) + '%',
                        escapeCSV(pd.category || 'Lainnya'),
                        escapeCSV(pd.pic || appState.name),
                        escapeCSV(pd.noContact || '-'),
                        escapeCSV(pd.noPic || '-'),
                        escapeCSV(pd.web || '-'),
                        escapeCSV(pd.sosmed ? pd.sosmed.link : '-')
                    ].join(',');
                });
                break;
            case 'Mod_KAM':
                headers = ["ID Account", "Account Name", "Tier", "Origin Mod", "Health Score", "Current Spend", "Potential Wallet", "Wallet Share (%)", "Total Opportunities"];
                rows = data.map(d => {
                    let pd = JSON.parse(d.pd || '{}');
                    let current = Number(d.value || d.vl) || 0;
                    let pot = Number(pd.potentialSpend) || current || 1;
                    return [
                        escapeCSV(d.id), escapeCSV(d.subject || d.sb), escapeCSV(pd.tier || 'Tier 1'), escapeCSV(pd.originModule || 'Manual'),
                        pd.healthScore || 0, current, pot, Math.round((current/pot)*100) + '%', (pd.opportunities||[]).length
                    ].join(',');
                });
                break;
            case 'Mod_Finance':
                headers = ["ID Transaksi", "Tanggal", "Tipe", "Kategori", "Deskripsi", "PIC", "Nominal (Rp)"];
                rows = data.map(d => {
                    let pd = JSON.parse(d.pd || '{}');
                    return [
                        escapeCSV(d.id), escapeCSV(pd.date || '-'), escapeCSV(d.stage || d.st), escapeCSV(pd.category || '-'),
                        escapeCSV(d.subject || d.sb), escapeCSV(pd.pic || '-'), Number(d.value || d.vl) || 0
                    ].join(',');
                });
                break;

            case 'Mod_B2CMatrix':
                headers = ["ID Lead", "Nama Pelanggan", "Stage Pipeline", "Estimasi Nilai (Rp)", "Probabilitas (%)", "Email", "No WhatsApp", "Social Media", "Kategori Lead"];
                rows = data.map(d => {
                    let pd = JSON.parse(d.pd || '{}');
                    return [
                        escapeCSV(d.id),
                        escapeCSV(d.subject || d.sb),
                        escapeCSV(d.stage || d.st),
                        Number(d.value || d.vl) || 0,
                        (pd.prob || 0) + '%',
                        escapeCSV(pd.email || '-'),
                        escapeCSV(pd.phone || '-'),
                        escapeCSV(pd.sosmed || '-'),
                        escapeCSV(pd.score || 'COLD')
                    ].join(',');
                });
                break;

            case 'Mod_B2CExpansion':
                headers = ["ID Node", "Nama Cabang / Partner", "Status Ops", "Manager PIC", "CAC (Acquisition Cost)", "LTV (Lifetime Value)", "Kesehatan Unit"];
                rows = data.map(d => {
                    let pd = JSON.parse(d.pd || '{}');
                    let cac = Number(pd.cac) || 0;
                    let ltv = Number(pd.ltv) || Number(d.value || d.vl) || 0;
                    return [
                        escapeCSV(d.id),
                        escapeCSV(d.subject || d.sb),
                        escapeCSV(d.stage || d.st),
                        escapeCSV(pd.pic || '-'),
                        cac,
                        ltv,
                        escapeCSV(cac > ltv ? 'AT RISK' : 'HEALTHY')
                    ].join(',');
                });
                break;

            case 'Mod_MOUTracker':
                headers = ["ID Kontrak", "Nama Partner / Dokumen", "Tipe Kontrak", "Stage Kontrak", "Nilai Kontrak (Rp)", "Tanggal Ttd", "Tanggal Expired", "PIC Legal"];
                rows = data.map(d => {
                    let pd = JSON.parse(d.pd || '{}');
                    return [
                        escapeCSV(d.id),
                        escapeCSV(d.subject || d.sb),
                        escapeCSV(pd.type || 'MOU'),
                        escapeCSV(d.stage || d.st),
                        Number(d.value || d.vl) || 0,
                        escapeCSV(pd.sign || '-'),
                        escapeCSV(pd.expiry || '-'),
                        escapeCSV(pd.pic || '-')
                    ].join(',');
                });
                break;

            case 'Mod_MarketIntel':
                headers = ["ID Competitor", "Nama Perusahaan Kompetitor", "Kategori", "Threat Level", "Est. Market Share (Rp)", "Advantage Score (%)", "Website / Medsos", "Strengths", "Weaknesses", "Deskripsi"];
                rows = data.map(d => {
                    let pd = JSON.parse(d.pd || '{}');
                    return [
                        escapeCSV(d.id),
                        escapeCSV(d.subject || d.sb),
                        escapeCSV(pd.category || 'General'),
                        escapeCSV(d.stage || d.st),
                        Number(d.value || d.vl) || 0,
                        (pd.score || 0) + '%',
                        escapeCSV(pd.web || '-'),
                        escapeCSV(pd.strengths || '-'),
                        escapeCSV(pd.weaknesses || '-'),
                        escapeCSV(pd.desc || '-')
                    ].join(',');
                });
                break;
            case 'Mod_Partnership':
                headers = ["ID Partner", "Nama Partner", "Kategori", "Tier", "Status", "Referral Code", "Total Leads", "Conversions", "Revenue Generated (Rp)", "Komisi Dicairkan (Rp)", "Email PIC", "Phone PIC"];
                rows = data.map(d => {
                    let pd = JSON.parse(d.pd || '{}');
                    return [
                        escapeCSV(d.id),
                        escapeCSV(d.subject || d.sb),
                        escapeCSV(pd.type || 'Affiliate'),
                        escapeCSV(pd.tier || 'Bronze'),
                        escapeCSV(d.stage || d.st),
                        escapeCSV(pd.refCode || '-'),
                        Number(pd.leads) || 0,
                        Number(pd.conv) || 0,
                        Number(d.value || d.vl) || 0,
                        Number(pd.paidOut) || 0,
                        escapeCSV(pd.email || '-'),
                        escapeCSV(pd.phone || '-')
                    ].join(',');
                });
                break;

            case 'Mod_CRM':
                headers = ["ID Customer", "Nama Pelanggan / Perusahaan", "Tipe Sektor", "Status Kesehatan CRM", "Nilai CSAT (%)", "Jumlah Open Tiket", "Keluhan / Notes"];
                rows = data.map(d => {
                    let pd = JSON.parse(d.pd || '{}');
                    let fb = pd.feedback || { experience: 0, quality: 0, comfort: 0 };
                    let avgCSAT = Math.round((Number(fb.experience) + Number(fb.quality) + Number(fb.comfort)) / 3) || 0;
                    let unresTickets = (pd.tickets || []).filter(t => t.status !== 'Resolved').length;
                    return [
                        escapeCSV(d.id),
                        escapeCSV(d.subject || d.sb),
                        escapeCSV(pd.originalModule === 'Mod_B2BMatrix' ? 'B2B Corporate' : 'B2C Retail'),
                        escapeCSV(pd.health || 'Excellent'),
                        avgCSAT + '%',
                        unresTickets,
                        escapeCSV(fb.notes || '-')
                    ].join(',');
                });
                break;

            default:
                headers = ["ID", "Judul / Subject", "Tahap / Stage", "Nilai (Rp)"];
                rows = data.map(d => [
                    escapeCSV(d.id),
                    escapeCSV(d.subject || d.sb),
                    escapeCSV(d.stage || d.st),
                    Number(d.value || d.vl) || 0
                ].join(','));
                break;
        }

        const csvContent = "\uFEFF" + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const dateStr = new Date().toISOString().split('T')[0];
        link.href = URL.createObjectURL(blob);
        link.download = `ApexBiz_${modKey}_Export_${dateStr}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        if (typeof ui !== 'undefined') {
            ui.loader(false);
            ui.notify("File CSV Berhasil Diunduh!");
        }
    } catch (err) {
        if (typeof ui !== 'undefined') {
            ui.loader(false);
            ui.error("Gagal mengekspor CSV: " + err.message);
        }
    }
};

// 3. DYNAMIC PDF EXPORTER
window.executePDF = function() {
    const modKey = appState.activeModule;
    let elementToPrint = null;
    let isLandscape = (modKey === 'Mod_WarRoom' || modKey === 'Mod_MarketIntel');

    if (typeof ui !== 'undefined') ui.loader(true, "Menyiapkan Dokumen Laporan PDF...");

    try {
        if (modKey === 'Mod_SmartPitch') {
            elementToPrint = document.getElementById('proposalPaper');
            if (!elementToPrint) {
                if (typeof ui !== 'undefined') { ui.loader(false); ui.error("Layout Proposal Smart Pitch Deck belum dirender."); }
                return;
            }
        } else {
            const pdfContainerId = isLandscape ? 'pdfLandscape' : 'pdfPortrait';
            let targetDiv = document.getElementById(pdfContainerId);
            
            if (!targetDiv) {
                let wrapper = document.getElementById('pdfWrapper');
                if(!wrapper) {
                    wrapper = document.createElement('div');
                    wrapper.id = 'pdfWrapper';
                    wrapper.style.cssText = 'position: fixed; left: -9999px; top: 0; z-index: -100; background: #fff;';
                    document.body.appendChild(wrapper);
                }
                targetDiv = document.createElement('div');
                targetDiv.id = pdfContainerId;
                targetDiv.className = 'a4-preview';
                wrapper.appendChild(targetDiv);
            }

            targetDiv.style.display = 'block';
            targetDiv.style.width = isLandscape ? '297mm' : '210mm';
            targetDiv.style.minHeight = isLandscape ? '210mm' : '297mm';
            targetDiv.style.padding = '15mm';
            targetDiv.style.background = '#ffffff';
            targetDiv.style.color = '#0f172a';

            targetDiv.innerHTML = window.buildPDFTemplate(modKey);
            elementToPrint = targetDiv;
        }

        const opt = {
            margin: [8, 8, 8, 8],
            filename: `ApexBiz_${modKey}_Report_${new Date().toISOString().split('T')[0]}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, logging: false },
            jsPDF: { unit: 'mm', format: 'a4', orientation: isLandscape ? 'landscape' : 'portrait' }
        };

        html2pdf().set(opt).from(elementToPrint).save().then(() => {
            if (typeof ui !== 'undefined') ui.loader(false);
            if (modKey !== 'Mod_SmartPitch') {
                elementToPrint.style.display = 'none';
            }
            if (typeof ui !== 'undefined') ui.notify("Laporan PDF Berhasil Diunduh!");
        }).catch(err => {
            if (typeof ui !== 'undefined') { ui.loader(false); ui.error("Gagal mencetak PDF: " + err.message); }
        });

    } catch (error) {
        if (typeof ui !== 'undefined') { ui.loader(false); ui.error("Terjadi kesalahan PDF: " + error.message); }
    }
};
